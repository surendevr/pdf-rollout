<div class="tool-page">
    <div class="tool-header">
        <div class="container">
            <a href="/" class="back-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Back to Home
            </a>
            <h1 class="tool-title">{{ toolName() }}</h1>
            <p class="tool-description">{{ toolDescription() }}</p>
        </div>
    </div>
    
    <div class="tool-content">
        <div class="container">
            <div 
                class="upload-zone"
                [class.drag-over]="isDragOver()"
                (dragover)="onDragOver($event)"
                (dragleave)="onDragLeave($event)"
                (drop)="onDrop($event)"
            >
                <svg class="upload-icon" width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M7 18C4.23858 18 2 15.7614 2 13C2 10.2386 4.23858 8 7 8C7.33566 8 7.66421 8.02867 7.98315 8.08348C8.3936 5.09974 10.9503 3 14 3C17.3137 3 20 5.68629 20 9C20 9.33344 19.9738 9.66088 19.9232 9.97998C21.1421 10.5798 22 11.8885 22 13.5C22 15.7091 20.2091 17.5 18 17.5H16M12 12V21M12 12L15 15M12 12L9 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <h3 class="upload-title">Drop your PDF file here</h3>
                <p class="upload-text">or click to browse your files</p>
                <input 
                    type="file" 
                    accept=".pdf" 
                    class="file-input"
                    (change)="onFileSelect($event)"
                />
                <button class="btn-primary btn-lg">Select PDF File</button>
            </div>
            
            <div class="features-list">
                <div class="feature">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Convert to slides</span>
                </div>
                <div class="feature">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Editable presentation</span>
                </div>
                <div class="feature">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>High quality output</span>
                </div>
            </div>
        </div>
    </div>
    
    <app-footer />
</div>
