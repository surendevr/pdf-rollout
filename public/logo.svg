<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Blue gradient for the document body -->
    <linearGradient id="docGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1A8FD1"/>
      <stop offset="100%" stop-color="#0073BB"/>
    </linearGradient>
    <!-- Darker gradient for the folded corner flap -->
    <linearGradient id="foldGrad" x1="18" y1="2" x2="27" y2="11" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#00548A"/>
      <stop offset="100%" stop-color="#003F6E"/>
    </linearGradient>
  </defs>

  <!-- ── Document body: rounded bottom corners, fold cut at top-right ── -->
  <path d="M5 4C5 2.895 5.895 2 7 2H18L27 11V28C27 29.105 26.105 30 25 30H7C5.895 30 5 29.105 5 28V4Z"
        fill="url(#docGrad)"/>

  <!-- ── Dog-ear fold corner ── -->
  <path d="M18 2L27 11H18Z" fill="url(#foldGrad)"/>

  <!-- ── Content lines: white on blue ── -->
  <rect x="8"  y="14" width="11" height="2" rx="1" fill="white" opacity="0.92"/>
  <rect x="8"  y="18" width="14" height="2" rx="1" fill="white" opacity="0.76"/>
  <rect x="8"  y="22" width="8"  height="2" rx="1" fill="white" opacity="0.76"/>

  <!-- ── Rollout right-arrow: white on blue ── -->
  <line x1="8" y1="27" x2="17" y2="27"
        stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M14 24.5L17 27L14 29.5"
        stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
