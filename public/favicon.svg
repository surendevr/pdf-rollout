<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Blue gradient for the app-icon background -->
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1A8FD1"/>
      <stop offset="100%" stop-color="#005FA3"/>
    </linearGradient>
  </defs>

  <!-- ── App-icon style: blue rounded-square background ── -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>

  <!-- ── White document body with dog-ear fold at top-right ── -->
  <path d="M6 5C6 4.448 6.448 4 7 4H19L26 11V27C26 27.552 25.552 28 25 28H7C6.448 28 6 27.552 6 27V5Z"
        fill="white"/>

  <!-- Fold corner: light blue (shows the paper edge) -->
  <path d="M19 4L26 11H19Z" fill="#B8DAEF"/>

  <!-- ── Content lines: blue on white ── -->
  <rect x="9" y="14" width="9"  height="1.5" rx="0.75" fill="#0073BB" opacity="0.75"/>
  <rect x="9" y="17" width="11" height="1.5" rx="0.75" fill="#0073BB" opacity="0.60"/>
  <rect x="9" y="20" width="7"  height="1.5" rx="0.75" fill="#0073BB" opacity="0.60"/>

  <!-- ── Rollout right-arrow: blue on white ── -->
  <line x1="9" y1="24" x2="16" y2="24"
        stroke="#0073BB" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M13.5 22L16 24L13.5 26"
        stroke="#0073BB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
